<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="veloopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Interconnected infinity/loop icon -->
  <g transform="translate(10, 10)">
    <path d="M12 20 C6 20 2 15 2 10 C2 5 6 0 12 0 C18 0 22 5 26 10 C30 15 34 20 40 20 C46 20 50 15 50 10 C50 5 46 0 40 0 C34 0 30 5 26 10 C22 15 18 20 12 20 Z" 
          stroke="url(#veloopGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
    <circle cx="12" cy="10" r="2.5" fill="#38bdf8" />
    <circle cx="40" cy="10" r="2.5" fill="#a855f7" />
  </g>
  <!-- Text -->
  <text x="75" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="1.5">
    VELOOP
  </text>
  <text x="75" y="45" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="10" fill="#38bdf8" letter-spacing="3">
    REWARDS
  </text>
</svg>
