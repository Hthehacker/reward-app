<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <defs>
    <linearGradient id="podGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="airpodsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="150" cy="200" r="120" fill="url(#airpodsGlow)"/>

  <!-- Left AirPod Earpiece -->
  <g transform="translate(60, 40) rotate(-10)">
    <!-- Stem -->
    <rect x="50" y="60" width="16" height="60" rx="8" fill="url(#podGloss)" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Sensor indent -->
    <rect x="54" y="80" width="8" height="18" rx="4" fill="#64748b" opacity="0.3"/>
    <!-- Head -->
    <ellipse cx="45" cy="55" rx="24" ry="20" fill="url(#podGloss)" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Mesh acoustic vent -->
    <ellipse cx="40" cy="48" rx="7" ry="5" fill="#1e293b"/>
    <!-- Silicone ear tip -->
    <ellipse cx="25" cy="56" rx="12" ry="16" fill="#e2e8f0"/>
  </g>

  <!-- Right AirPod Earpiece -->
  <g transform="translate(150, 20) rotate(10)">
    <!-- Stem -->
    <rect x="50" y="60" width="16" height="60" rx="8" fill="url(#podGloss)" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Sensor indent -->
    <rect x="54" y="80" width="8" height="18" rx="4" fill="#64748b" opacity="0.3"/>
    <!-- Head -->
    <ellipse cx="65" cy="55" rx="24" ry="20" fill="url(#podGloss)" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Mesh acoustic vent -->
    <ellipse cx="70" cy="48" rx="7" ry="5" fill="#1e293b"/>
    <!-- Silicone ear tip -->
    <ellipse cx="85" cy="56" rx="12" ry="16" fill="#e2e8f0"/>
  </g>

  <!-- MagSafe Charging Case (Lower portion) -->
  <g transform="translate(65, 170)">
    <rect x="0" y="0" width="170" height="140" rx="45" fill="url(#podGloss)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Lid seam -->
    <line x1="5" y1="42" x2="165" y2="42" stroke="#cbd5e1" stroke-width="1.8"/>
    <!-- Status LED (Green) -->
    <circle cx="85" cy="62" r="3.5" fill="#22c55e" filter="drop-shadow(0 0 4px #22c55e)"/>
    <!-- Metallic hinge preview seam -->
    <rect x="70" y="38" width="30" height="8" rx="2" fill="#cbd5e1"/>
  </g>
</svg>
