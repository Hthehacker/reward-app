<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <defs>
    <linearGradient id="titaniumFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="screenWallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="80%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Outer chassis -->
  <rect x="60" y="20" width="180" height="360" rx="36" fill="url(#titaniumFrame)" stroke="#334155" stroke-width="2"/>
  
  <!-- Inner bezel -->
  <rect x="63" y="23" width="174" height="354" rx="33" fill="#000000"/>

  <!-- Screen -->
  <rect x="68" y="28" width="164" height="344" rx="28" fill="url(#screenWallpaper)"/>
  
  <!-- Dynamic Island -->
  <rect x="122" y="38" width="56" height="18" rx="9" fill="#000000" stroke="#1e293b" stroke-width="0.8"/>
  <circle cx="166" cy="47" r="4.5" fill="#0f172a"/>
  <circle cx="166" cy="47" r="2" fill="#0284c7" opacity="0.6"/>

  <!-- Wallpaper accent circles -->
  <circle cx="150" cy="190" r="45" fill="#6366f1" opacity="0.4" filter="blur(20px)"/>
  <circle cx="130" cy="240" r="35" fill="#ec4899" opacity="0.3" filter="blur(25px)"/>

  <!-- Clock & Widgets -->
  <text x="150" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700" fill="#f8fafc" text-anchor="middle">09:41</text>
  <text x="150" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle">Tuesday, October 13</text>

  <!-- Lockscreen Quick Actions -->
  <circle cx="95" cy="340" r="14" fill="rgba(255,255,255,0.15)"/>
  <circle cx="205" cy="340" r="14" fill="rgba(255,255,255,0.15)"/>
  <!-- Home Indicator bar -->
  <rect x="120" y="362" width="60" height="3.5" rx="2" fill="#ffffff" opacity="0.75"/>

  <!-- Screen Glass reflection -->
  <path d="M68 28 L232 28 L140 372 L68 372 Z" fill="url(#screenGlass)"/>

  <!-- Physical buttons -->
  <rect x="57" y="90" width="3" height="18" rx="1.5" fill="#94a3b8"/> <!-- Action button -->
  <rect x="57" y="120" width="3" height="35" rx="1.5" fill="#94a3b8"/> <!-- Vol Up -->
  <rect x="57" y="165" width="3" height="35" rx="1.5" fill="#94a3b8"/> <!-- Vol Down -->
  <rect x="240" y="125" width="3" height="50" rx="1.5" fill="#94a3b8"/> <!-- Power -->
</svg>
